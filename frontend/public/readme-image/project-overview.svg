<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">까까 프로젝트 문제 해결 흐름</title>
  <desc id="desc">게임 밖에서 단절된 플레이어와 친구를 Electron 게임 감지, React 공통 화면, 실시간 통신으로 연결하고 경기 후 도감과 상호작용으로 관계를 이어 우수상을 수상한 과정을 보여주는 3단 인포그래픽</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1b" />
      <stop offset="0.55" stop-color="#11162b" />
      <stop offset="1" stop-color="#17112c" />
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6c453" />
      <stop offset="1" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28" />
    </filter>
    <marker id="arrow-violet" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#a78bfa" />
    </marker>
    <marker id="arrow-gold" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#f6c453" />
    </marker>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#background)" />
  <circle cx="1110" cy="35" r="150" fill="#8b5cf6" opacity="0.06" />
  <circle cx="90" cy="350" r="130" fill="#f6c453" opacity="0.035" />

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="40" y="38" fill="#a78bfa" font-size="12" font-weight="700" letter-spacing="2.2">KKAKKA · PRODUCT STORY</text>
    <text x="1160" y="38" fill="#77809a" font-size="12" text-anchor="end">Web · PWA · Electron</text>

    <path d="M376 190 H420" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrow-violet)" />
    <path d="M777 190 H821" fill="none" stroke="#f6c453" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrow-gold)" />

    <g filter="url(#shadow)">
      <rect x="32" y="58" width="332" height="266" rx="20" fill="#12192b" stroke="#2c3650" />
      <rect x="433" y="58" width="334" height="266" rx="20" fill="#18152e" stroke="#8b5cf6" stroke-width="1.5" />
      <rect x="834" y="58" width="334" height="266" rx="20" fill="#191827" stroke="#b9852b" stroke-width="1.5" />
    </g>

    <!-- 01: problem -->
    <rect x="52" y="78" width="94" height="26" rx="13" fill="#222b40" />
    <text x="99" y="96" fill="#aab3c8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.3">01 · GAP</text>

    <g transform="translate(74 120)">
      <circle cx="34" cy="31" r="18" fill="#26304a" stroke="#63708f" />
      <circle cx="34" cy="27" r="6" fill="#9ca7be" />
      <path d="M23 43 C27 35 41 35 45 43" fill="none" stroke="#9ca7be" stroke-width="3" stroke-linecap="round" />
      <circle cx="130" cy="31" r="18" fill="#26304a" stroke="#63708f" />
      <circle cx="130" cy="27" r="6" fill="#9ca7be" />
      <path d="M119 43 C123 35 137 35 141 43" fill="none" stroke="#9ca7be" stroke-width="3" stroke-linecap="round" />
      <path d="M58 31 H78 M86 31 H106" stroke="#67728c" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 7" />
      <path d="M79 24 L87 38 M87 24 L79 38" stroke="#f87171" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <text x="52" y="203" fill="#f3f5fb" font-size="23" font-weight="750">게임 밖의 단절</text>
    <text x="52" y="229" fill="#9ba6bd" font-size="14">플레이어와 시청자의 채널 분리</text>
    <text x="52" y="251" fill="#9ba6bd" font-size="14">경기 후 사라지는 장면과 대화</text>
    <line x1="52" y1="273" x2="344" y2="273" stroke="#2b354d" />
    <text x="52" y="300" fill="#737f98" font-size="12">GAME · VOICE · MESSENGER</text>

    <!-- 02: live connection and boundary -->
    <rect x="453" y="78" width="126" height="26" rx="13" fill="#36245b" />
    <text x="516" y="96" fill="#d8c7ff" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.2">02 · CONNECT</text>

    <g transform="translate(475 118)">
      <rect x="0" y="0" width="80" height="56" rx="8" fill="#221b3d" stroke="#9d79f5" stroke-width="1.5" />
      <path d="M14 30 H23 L29 18 L38 41 L46 25 L53 30 H66" fill="none" stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M32 63 H48 M40 56 V63" stroke="#9d79f5" stroke-width="2" stroke-linecap="round" />
      <path d="M97 28 H126" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)" />
      <rect x="137" y="0" width="80" height="56" rx="8" fill="#221b3d" stroke="#9d79f5" stroke-width="1.5" />
      <path d="M154 18 H200 M154 28 H190 M154 38 H196" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round" />
      <circle cx="203" cy="41" r="5" fill="#f6c453" />
    </g>

    <text x="453" y="203" fill="#ffffff" font-size="23" font-weight="750">라이브 연결 · 실행 경계</text>
    <text x="453" y="229" fill="#c0b8d7" font-size="14">게임 이벤트를 친구의 소셜 화면으로</text>
    <g>
      <rect x="453" y="248" width="82" height="26" rx="7" fill="#2b2148" />
      <rect x="543" y="248" width="70" height="26" rx="7" fill="#2b2148" />
      <rect x="621" y="248" width="124" height="26" rx="7" fill="#2b2148" />
      <text x="494" y="266" fill="#d9ccfa" font-size="11" font-weight="650" text-anchor="middle">Electron</text>
      <text x="578" y="266" fill="#d9ccfa" font-size="11" font-weight="650" text-anchor="middle">React</text>
      <text x="683" y="266" fill="#d9ccfa" font-size="11" font-weight="650" text-anchor="middle">REST · STOMP · SSE</text>
    </g>
    <text x="453" y="301" fill="#a78bfa" font-size="12" font-weight="650">MOCK ↔ REAL · SAME UI CONTRACT</text>

    <!-- 03: relationship and outcome -->
    <rect x="854" y="78" width="130" height="26" rx="13" fill="#47391b" />
    <text x="919" y="96" fill="#f8d77e" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.2">03 · CONTINUE</text>

    <g transform="translate(879 119)">
      <rect x="0" y="0" width="66" height="54" rx="8" fill="#2b2830" stroke="#d5a63f" stroke-width="1.5" />
      <path d="M13 15 H53 M13 25 H45 M13 35 H50" stroke="#f4d47f" stroke-width="3" stroke-linecap="round" />
      <path d="M82 27 H108" stroke="#d8ad4f" stroke-width="2" marker-end="url(#arrow-gold)" />
      <circle cx="144" cy="27" r="26" fill="#352d22" stroke="#f6c453" stroke-width="1.5" />
      <path d="M144 42 C126 30 132 17 144 25 C156 17 162 30 144 42 Z" fill="#f6c453" />
      <circle cx="205" cy="27" r="20" fill="#4a3918" stroke="#f6c453" />
      <path d="M205 12 L209 21 L219 22 L211 29 L214 39 L205 34 L196 39 L199 29 L191 22 L201 21 Z" fill="#f6c453" />
    </g>

    <text x="854" y="203" fill="#fffaf0" font-size="23" font-weight="750">관계 지속 · 성과</text>
    <text x="854" y="229" fill="#c7bea9" font-size="14">도감 · 댓글 · 반응 · 칭호 · 아이템</text>
    <line x1="854" y1="251" x2="1148" y2="251" stroke="#403927" />
    <text x="854" y="279" fill="#f6c453" font-size="16" font-weight="750">SSAFY 공통 프로젝트 우수상</text>
    <text x="854" y="302" fill="#948b78" font-size="12">6인 팀 · Web · PWA · Electron</text>
  </g>
</svg>
